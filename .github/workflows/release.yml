name: release-desktop

# v* 태그 push 또는 수동 dispatch:
#  - test: api 테스트 (스텁 AI, 계약 강제형)
#  - desktop: 3-OS 인스톨러 빌드 → GitHub Release(draft) 업로드
#  - publish-release: 전 인스톨러 + 테스트 통과 후 draft 공개
#    (coxpit-oss release.yml 계승 — 업데이터 타이밍 404 창 방지)
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # dmg (arm64 + x64)
          - os: windows-latest    # nsis exe
          - os: ubuntu-latest     # AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # 풀 설치로 web/api 빌드 → prod 의존성만 남겨 앱에 번들
      - run: npm ci
      - run: npm run build
      - run: npm ci --omit=dev

      - run: npm ci
        working-directory: desktop
      # 서명 시크릿은 macOS에서만 사용 — 미설정 시 unsigned 빌드.
      - run: |
          if [ "$RUNNER_OS" != "macOS" ] || [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx electron-builder --publish always
        shell: bash
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: publish the draft release
        run: gh release edit "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
